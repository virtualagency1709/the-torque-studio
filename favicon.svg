<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D5E" />
      <stop offset="60%" stop-color="#E63946" />
      <stop offset="100%" stop-color="#9E1825" />
    </linearGradient>
    <linearGradient id="shieldSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E5E9" />
      <stop offset="100%" stop-color="#9BA1AB" />
    </linearGradient>
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E63946" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="64" height="64" rx="14" fill="#101114" />
  <!-- Outer Shield Crest -->
  <g filter="url(#shieldGlow)">
    <path d="M32 6 L53 14 V32 C53 45.5 43.5 56 32 60 C20.5 56 11 45.5 11 32 V14 Z" fill="url(#shieldRed)" stroke="url(#shieldSilver)" stroke-width="2" />
    <!-- Inner Dark Inset -->
    <path d="M32 10.5 L48.5 17 V32 C48.5 42.5 40.5 51.5 32 55 C23.5 51.5 15.5 42.5 15.5 32 V17 Z" fill="#141519" stroke="url(#shieldSilver)" stroke-width="1.2" opacity="0.95" />
    <!-- Radiant 'R' Monogram -->
    <path d="M26 21 H35.5 C39 21 41 23 41 26.2 C41 29 39 31 36.2 31.5 L41.5 41 H36.8 L32.2 32.5 H29.8 V41 H26 V21 Z M29.8 24.5 V29 H35.2 C36.8 29 37.6 28.1 37.6 26.7 C37.6 25.3 36.8 24.5 35.2 24.5 Z" fill="url(#shieldSilver)" />
    <!-- Radiant Star Accent -->
    <path d="M38 15 L39.2 18 L42 19.2 L39.2 20.4 L38 23.4 L36.8 20.4 L34 19.2 L36.8 18 Z" fill="#FF4D5E" />
  </g>
</svg>
